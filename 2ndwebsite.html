<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body {
            background-color: grey;
        }

        .card {
            background-color: white;
            width: 198px;
            height: 344px;
            border-radius: 7px;
        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 7px;
        }
        .content{
            padding: 7px 13px;
        }
        .content p{
            font-size: 9px;
        }
        .capsule{
            padding: 0 28px 0 14PX;
        }
        .capsule span{
            border: 1px solid black;
            padding: 0px 6px;
            border-radius: 11px;
            font-size: 8px;
        }
        .P{
            color: grey;
        }
        .button{
            text-align: center;
        }
        .button button{
            padding: 7px 15px;
            border-radius: 15px;
            background-color: aquamarine;
            color: blue;
            font-size: 8px;
            border: none;
            margin-top: 7px;
            font-weight: bold;
        }
        .button button:hover{
            background-color: aliceblue;
            color: rgb(76, 55, 212);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="188px"
                src="https://img.magnific.com/free-photo/old-fishing-boat-river-with-breathtaking-view-sunset_181624-16031.jpg?semt=ais_hybrid&w=740&q=80"
                alt="image">
        </div>
        <div class="capsule">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <h2>KOOL</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae inventore suscipit aspernatur
                eligendi atque, doloremque veritatis, dolore laborum veniam dicta ratione architecto pariatur.</p>
        </div>
        <div class="button">
            <button>Read more</button>
        </div>
    </div>
</body>

</html>
